name: adot_shop_app
description: "ADOT | আদত - Store Management System App"
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  google_fonts: ^6.1.0
  intl: ^0.19.0
  flutter_spinkit: ^5.2.0
  pdf: ^3.10.8
  printing: ^5.11.1
  shared_preferences: ^2.2.2
  image_picker: ^1.2.3
  image_cropper: ^12.2.1
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Kalpurush.ttf
    - assets/images/
